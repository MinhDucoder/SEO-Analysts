name: seo-platform

services:
  # ─── Infrastructure ───

  gateway-db:
    image: postgres:16-alpine
    container_name: seo-gateway-db
    environment:
      POSTGRES_USER: ${GATEWAY_DB_USER}
      POSTGRES_PASSWORD: ${GATEWAY_DB_PASS}
      POSTGRES_DB: ${GATEWAY_DB_NAME}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - gateway_db_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GATEWAY_DB_USER} -d ${GATEWAY_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  analyzer-db:
    image: postgres:16-alpine
    container_name: seo-analyzer-db
    environment:
      POSTGRES_USER: ${ANALYZER_DB_USER}
      POSTGRES_PASSWORD: ${ANALYZER_DB_PASS}
      POSTGRES_DB: ${ANALYZER_DB_NAME}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - analyzer_db_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ANALYZER_DB_USER} -d ${ANALYZER_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  report-db:
    image: postgres:16-alpine
    container_name: seo-report-db
    environment:
      POSTGRES_USER: ${REPORT_DB_USER}
      POSTGRES_PASSWORD: ${REPORT_DB_PASS}
      POSTGRES_DB: ${REPORT_DB_NAME}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - report_db_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${REPORT_DB_USER} -d ${REPORT_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: seo-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Application Services ───

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    container_name: seo-gateway
    ports:
      - "3000:3000"
      - "50051:50051"
    environment:
      NODE_ENV: production
      PORT: "3000"
      GRPC_PORT: "50051"
      DATABASE_URL: "postgresql://${GATEWAY_DB_USER}:${GATEWAY_DB_PASS}@gateway-db:5432/${GATEWAY_DB_NAME}"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
      JWT_SECRET: "${JWT_SECRET}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET}"
      FRONTEND_URL: "${FRONTEND_URL}"
      CRAWLER_GRPC_URL: "crawler:50052"
      ANALYZER_GRPC_URL: "seo-analyzer:50053"
      KEYWORD_GRPC_URL: "keyword-analyzer:50054"
      REPORT_GRPC_URL: "report:50055"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
      GOOGLE_CALLBACK_URL: "${GOOGLE_CALLBACK_URL}"
    depends_on:
      gateway-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      crawler:
        condition: service_healthy
      seo-analyzer:
        condition: service_healthy
      keyword-analyzer:
        condition: service_healthy
      report:
        condition: service_healthy
    networks:
      - backend
      - data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  crawler:
    build:
      context: .
      dockerfile: apps/crawler/Dockerfile
    container_name: seo-crawler
    environment:
      NODE_ENV: production
      GRPC_PORT: "50052"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend
      - data
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: '1.0'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  seo-analyzer:
    build:
      context: .
      dockerfile: apps/seo-analyzer/Dockerfile
    container_name: seo-analyzer
    environment:
      NODE_ENV: production
      GRPC_PORT: "50053"
      DATABASE_URL: "postgresql://${ANALYZER_DB_USER}:${ANALYZER_DB_PASS}@analyzer-db:5432/${ANALYZER_DB_NAME}"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
    depends_on:
      analyzer-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
      - data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  keyword-analyzer:
    build:
      context: .
      dockerfile: apps/keyword-analyzer/Dockerfile
    container_name: seo-keyword-analyzer
    environment:
      NODE_ENV: production
      GRPC_PORT: "50054"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend
      - data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  report:
    build:
      context: .
      dockerfile: apps/report/Dockerfile
    container_name: seo-report
    ports:
      - "3004:3004"
      - "50055:50055"
    environment:
      NODE_ENV: production
      HTTP_PORT: "3004"
      GRPC_PORT: "50055"
      DATABASE_URL: "postgresql://${REPORT_DB_USER}:${REPORT_DB_PASS}@report-db:5432/${REPORT_DB_NAME}"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
    depends_on:
      report-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
      - data
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: '1.0'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  backend:
    driver: bridge
  data:
    driver: bridge

volumes:
  gateway_db_data:
  analyzer_db_data:
  report_db_data:
  redis_data:
